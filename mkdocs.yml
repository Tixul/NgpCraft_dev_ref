site_name: NGPC Dev Wiki
site_description: >-
  Developer reference for programming the Neo Geo Pocket Color (NGPC)
  and its Toshiba TLCS-900/H CPU.
# Published site URL (enables canonical links + sitemap.xml)
site_url: https://tixul.github.io/NgpCraft_dev_ref/
docs_dir: docs
site_dir: site

# Footer attribution: identifies the source without narrowing the scope
# (the wiki covers NGPC development in general, not one toolchain).
copyright: Maintained as part of the NgpCraft NGPC ecosystem.

theme:
  name: material
  language: en
  icon:
    logo: material/gamepad-variant
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections      # show sections expanded in the sidebar
    - navigation.top           # back-to-top button
    - navigation.tracking      # update URL with the active anchor
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy        # copy button on code blocks
    - content.tooltips

plugins:
  - search

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      # GitHub-compatible heading slugs so the in-page TOC links resolve
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Hardware:
      - Hardware Registers: 01_Hardware/Hardware-Registers.md
      - BIOS: 01_Hardware/BIOS.md
  - CPU & Toolchain:
      - TLCS-900/H Reference: 02_CPU-and-Toolchain/TLCS900-Reference.md
      - Assembly: 02_CPU-and-Toolchain/Assembly.md
      - Build Toolchain: 02_CPU-and-Toolchain/Build-Toolchain.md
  - Graphics:
      - Overview: 03_Graphics/Overview.md
      - Sprites and OAM: 03_Graphics/Sprites-and-OAM.md
      - Tilemaps and Scrolling: 03_Graphics/Tilemaps-and-Scrolling.md
      - Colors and Palettes: 03_Graphics/Colors-and-Palettes.md
      - Effects and Raster: 03_Graphics/Effects-and-Raster.md
      - DMA: 03_Graphics/DMA.md
      - VRAM Queue: 03_Graphics/VRAM-Queue.md
  - Audio:
      - Audio: 04_Audio/Audio.md
  - Systems:
      - Game Loop: 05_Systems/Game-Loop.md
      - Input: 05_Systems/Input.md
      - Link Cable: 05_Systems/Link-Cable.md
      - Storage and Saves: 05_Systems/Storage-and-Saves.md
      - Collision: 05_Systems/Collision.md
      - Fixed-Point Math: 05_Systems/Fixed-Point-Math.md
      - Localization: 05_Systems/Localization.md
      - Debug Tools: 05_Systems/Debug-Tools.md
  - Pipeline & Patterns:
      - Asset Pipeline: 06_Pipeline-and-Patterns/Asset-Pipeline.md
      - Gameplay Patterns: 06_Pipeline-and-Patterns/Gameplay-Patterns.md
